[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  # esbuild bundles dependencies into the function, handling CJS/ESM interop
  # automatically (@anthropic-ai/sdk and supabase are ESM).
  node_bundler = "esbuild"

[context.production.environment]
  NODE_VERSION = "20"

[context.deploy-preview.environment]
  NODE_VERSION = "20"
